[theme]
primaryColor = "#1ABC9C"
backgroundColor = "#F7F9FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0A2540"
font = "sans serif"

# Native sidebar theming (Streamlit 1.35+) — this is the primary fix for the
# sidebar's low-contrast/invisible-button bug. Custom CSS selectors that
# target internal testids (e.g. [data-testid="stSidebar"]) can silently stop
# matching across Streamlit point releases; this [theme.sidebar] section is
# a stable, versioned public API that always wins, so the dark background +
# light text no longer depend on our CSS overrides working at all. The CSS
# in assets/style.css keeps its own sidebar rules too, as a second layer.
#
# Deliberately a neutral dark (not brand navy/teal): after this failed
# repeatedly with brand colours, the goal here is maximum, foolproof
# legibility over brand-matching.
[theme.sidebar]
backgroundColor = "#1C1F26"
secondaryBackgroundColor = "#2B2F38"
textColor = "#E8EAED"

[browser]
gatherUsageStats = false
